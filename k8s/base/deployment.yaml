apiVersion: apps/v1
kind: Deployment
metadata:
  name: semana09-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: semana09-app
  template:
    metadata:
      labels:
        app: semana09-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: semana09-app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CLOUD_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: semana09-config
                  key: CLOUD_PROVIDER
            - name: VM_ROLE
              value: k8s-pod
            - name: VM_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
