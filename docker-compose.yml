# Prueba rápida sin Terraform: levanta 32 réplicas de la "VM" en Docker.
#   docker compose up -d --build --scale vm=32
#   docker compose ps
services:
  vm:
    build: ./app
    image: semana09-app:local
    environment:
      CLOUD_PROVIDER: docker-compose
      VM_ROLE: generic
    expose:
      - "8080"
    restart: unless-stopped

  # Balanceador simple delante de las réplicas para probar desde el host.
  lb:
    image: semana09-app:local
    pull_policy: never
    depends_on:
      - vm
    entrypoint: ["python", "-c"]
    command:
      - |
        import http.server, urllib.request
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                with urllib.request.urlopen("http://vm:8080" + self.path) as r:
                    body = r.read()
                self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
        http.server.ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
    ports:
      - "8080:8080"
